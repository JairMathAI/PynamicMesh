Data:
  path_str: './Mesh_models'


Basic_Geometry:
  compute_basicGeo: True
  plot_basicGeo: True
  metrics: 'all'

Functional_Map:
  matrix_tranformation: True
  diagonal_analysis: True
  isometric_analysis: True
  k_eigenfunctions: [10, 10]          # size of the map (k1, k2); a single int k means (k, k)
  k_eigenvalues: 100
  # Descriptor families and energy shares: WKS, HKS, MKS (Matérn), XYZ (aligned coordinates), NRM (normals).
  # 'WKS+HKS' -> equal shares; weights are renormalized to sum to one.
  descriptor: '0.6*WKS + 0.4*MKS'
  # null (no landmarks) | 'precomputed' (landmark.npy from precompute_landmarks) | 'auto' (automatic selection)
  landmarks: 'auto'
  compute_physic_fields: True
  fm_params:
    # 'none' | 'landmarks' | 'orientation' | 'extrinsic', combinable with '+'
    symmetry_mode: 'landmarks+orientation+extrinsic'
    n_descr: 100                      # spectral filters per descriptor family
    subsample_step: 4                 # keep 1 column out of 4 (recommended with landmarks)
    landmark_params:                  # automatic landmark selection ('auto') and landmark block
      n_landmarks: 12
      match: 'hybrid'                 # 'hybrid' | 'extrinsic' | 'identity'
      max_rel_dist: 0.15
      max_distortion: 0.25
      min_landmarks: 4
      search_rel_radius: 0.10
      weight: 1.0
    descr_params:
      nu: 1.5                         # Matérn smoothness (MKS)
      # min_l: 0.01                   # Matérn lengthscale range; default mesh-adaptive
      # max_l: 10.0
      k_smooth: 30                    # LB low-pass for XYZ / NRM
      xyz_weight: 0.25                # energy share of the XYZ block added by 'extrinsic'
    fit_params:
      w_descr: 0.1
      w_lap: 0.001
      w_dcomm: 1.0
      w_orient: 1.0                   # only used when symmetry_mode includes 'orientation'
    refine: 'auto'                    # 'auto' (ZoomOut) | 'icp' | [nit, step]
    dt: 1.0                           # time step for velocity / acceleration fields
    verbose: False

Reeb_Graph:
  compute_reeb: True
  time_graph_analysis: True
  reeb_scalar: 'geodesic'
  bins: 30
  scalar_args:
    vertex_ref_index: [4896]          # index, list of indices, 'mass_center' or 'precomputed'
    geodesic_solver: 'heat'           # 'heat' | 'dijkstra'
    equalize_histogram: False         # True -> rank-normalized field (equally populated bins)

Graph_similarity:
    graph_sim: True
    graph_metrics: all
MS_Complex:
  # Morse–Smale complex of a scalar field on every mesh: regions of the maxima = protrusion segmentation,
  # critical points after persistence simplification (csv + plots under Results/<scene>/MSComplexAnalysis).
  compute_mscomplex: True
  ms_scalar: 'dist_centroid'          # any Reeb scalar method; null -> the Reeb field above (reused, not recomputed)
  ms_persistence: 0.08                # extrema lower than 8% of the field range are merged (noise); 0 keeps all
  ms_min_region_area: 0.0             # optionally merge regions smaller than this fraction of the surface
  mscomplex_graph: True               # critical-point graph (star to the centre of mass) + Reeb-graph analyses on it
  ms_graph_type: 'star+adjacency'     # 'star' | 'star+adjacency' (edges between adjacent protrusion regions)
  ms_graph_metrics: all               # graph_similarity metrics on the critical-point graphs
  ms_track_regions: True              # regions / critical points followed through the functional maps (needs FM)
  ms_tracker_params:                  # advanced tracker options (may also be written flat in this section)
    iou_threshold: 0.25               # minimum area-weighted IoU for a matched region pair
    dominance: 0.5                    # dominant-overlap fraction for split / merge relations
    fate_radius: 0.04                 # nearest critical point search radius (fraction of sqrt(area))
    growth_tolerance: 0.002           # |normal displacement| below this is 'stable'
    ghost_horizon: 6                  # frames a vanished critical point keeps being followed (inversions)
  # scalar_args:                      # extra options of ms_scalar when it differs from the Reeb field
  #   vertex_ref_index: 'mass_center' # (options already given in Reeb_Graph/scalar_args are shared)