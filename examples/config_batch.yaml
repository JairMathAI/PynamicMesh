# Root of the scene folder container
Data:
  path_str: './Mesh_models'
  devices: 'all'                      # GPUs: 'all' | 'cpu' | '0,1' (command line: --devices)
  workers: null                       # worker processes (null = CPU cores - 1, at most 8)
  parallel_scenes: 'auto'
  compare_scenes: 'auto'              # comparison of the scenes (Results/_comparison)            # several scenes at once, one per GPU: 'auto' (>1 GPU and >1 scene) | True | False

# Sections written here at the top level are DEFAULTS for every scene (a scene section with the same name overrides
# them key by key): convenient for the GIF and time settings shared by all the scenes.
GIF:
  gif: True
  gif_params: {fps: 6, real_time: True, max_frames: 240}
Reeb_Dynamics:                        # shared by every scene (needs trajectories in the scene)
  compute_reeb_dynamics: True
  reeb_dynamics_params: {persistence: 0.08, substeps: 4}
Motion_Analysis:                      # shared by every scene (needs trajectories in the scene)
  compute_motion_analysis: True
  motion_params: {ftle_window: 3, dmd_forecast: 3}
Frame_Times:
  frame_interval: null
  time_unit: 's'
  auto_detect: True                   # every scene folder may carry its own frame_times.csv

################################################################### Individual params for each scene on the folder ####################################################################################################
# scene1: automatic landmarks + orientation term + extrinsic descriptors (recommended for shapes with bilateral symmetry)
scene1:
  Basic_Geometry:
    compute_basicGeo: True
    plot_basicGeo: True
    metrics: 'all'

  Functional_Map:
    matrix_tranformation: True
    diagonal_analysis: True
    isometric_analysis: True
    k_eigenfunctions: [10, 10]
    k_eigenvalues: 100
    descriptor: '0.6*WKS + 0.4*MKS'
    landmarks: 'auto'
    compute_physic_fields: True
    fm_params:
      symmetry_mode: 'landmarks+orientation+extrinsic'
      subsample_step: 4
      landmark_params:
        n_landmarks: 12
        match: 'hybrid'
      descr_params:
        nu: 1.5
        xyz_weight: 0.25
      fit_params:
        w_orient: 1.0

  Reeb_Graph:
    compute_reeb: True
    time_graph_analysis: True
    reeb_scalar: 'geodesic'
    bins: 30
    scalar_args:
      vertex_ref_index: [4896]
      geodesic_solver: 'heat'

  Graph_similarity:
      graph_sim: True
      graph_metrics: all

  MS_Complex:
    compute_mscomplex: True
    ms_scalar: 'dist_centroid'        # protrusion segmentation
    ms_persistence: 0.08
    mscomplex_graph: True
    ms_graph_type: 'star+adjacency'
    ms_track_regions: True
    ms_tracker_params:
      iou_threshold: 0.25
      dominance: 0.5
      ghost_horizon: 6
      adaptive: True
    ms_protrusion_params:
      enabled: True
      beta: 0.012
      temporal: True

  Parametrization:
    compute_parametrization: True
    param_params: {sphere_method: 'conformal', area_weight: 0.7, L_max: 25, mh_modes: 80, plots: True,
                   high_degree: True, hd_lmax: 128}           # walking animal: legs need a high degree

  Trajectories:
    compute_trajectories: True
    traj_params:
      trajectory_method: 'arap_tracking'
      rigidity_params: {enabled: True, mode: 'arap'}     # walking animal: near-isometric motion
      schemes: ['hermite_catmull_rom', 'natural_cubic', 'arap_polar']
      substeps: 4

  Graph_Animation:
    compute_graph_animation: True
    graph_animation_params: {graphs: ['reeb', 'mscomplex'], frame: 0, model: ['arap_polar', 'natural_cubic']}

  Dynamic_Analysis:
    compute_dynamic_analysis: True
    dyn_analysis_params: {hodge: True, ftle: True, shape_space: True, change_points: True, homology: False,
                          shape_source: 'auto', spherical_spectra: True}

  Frame_Times:                        # this scene: one frame every 0.5 s (overrides the shared Frame_Times)
    frame_interval: 0.5

# scene2: precomputed (manually selected) landmarks only; FM options written flat (equivalent to nesting them in fm_params)
scene2:
  Basic_Geometry:
    compute_basicGeo: True
    plot_basicGeo: True
    metrics: 'all'

  Functional_Map:
    matrix_tranformation: True
    diagonal_analysis: True
    isometric_analysis: True
    k_eigenfunctions: [10, 10]
    k_eigenvalues: 100
    descriptor: 'WKS+HKS+MKS'
    landmarks: 'precomputed'
    symmetry_mode: 'landmarks'
    subsample_step: 4
    compute_physic_fields: True

  Reeb_Graph:
    compute_reeb: True
    time_graph_analysis: True
    reeb_scalar: 'heat_diffusion'
    bins: 25
    scalar_args:
      source_idx: 'mass_center'
      t: 'auto'

  Graph_similarity:
      graph_sim: True
      graph_metrics: all

  MS_Complex:                         # complex of the Reeb field itself (heat_diffusion, reused), tracker options flat
    compute_mscomplex: True
    ms_scalar: null
    ms_persistence: 0.05
    mscomplex_graph: False
    ms_track_regions: True
    fate_radius: 0.05
    growth_tolerance: 0.003

  Trajectories:                       # parameters written flat (equivalent to traj_params)
    compute_trajectories: True
    trajectory_method: 'arap_tracking'
    rigidity_params: {enabled: True, mode: 'asap'}       # growing cells: as-similar-as-possible
    schemes: ['hermite_catmull_rom', 'arap_polar']

  Dynamic_Analysis:
    compute_dynamic_analysis: True

# scene3: no landmarks, symmetry-aware descriptors only (XYZ requested explicitly in the descriptor string)
scene3:
  Basic_Geometry:
    compute_basicGeo: True
    plot_basicGeo: True
    metrics: 'all'

  Functional_Map:
    matrix_tranformation: True
    diagonal_analysis: True
    isometric_analysis: True
    k_eigenfunctions: 10
    k_eigenvalues: 100
    descriptor: '0.5*WKS + 0.3*MKS + 0.2*XYZ'
    landmarks: null
    compute_physic_fields: True
    fm_params:
      symmetry_mode: 'orientation'
      fit_params:
        w_orient: 1.0

  Reeb_Graph:
    compute_reeb: True
    time_graph_analysis: True
    reeb_scalar: 'x'
    bins: 5

  Graph_similarity:
      graph_sim: True
      graph_metrics: all

  MS_Complex:                         # Morse–Smale analysis switched off for this scene
    compute_mscomplex: False

  GIF:                                # no GIFs for this scene (overrides the shared GIF section)
    gif: False
  # no Parametrization / Trajectories / Graph_Animation / Dynamic_Analysis sections: those stages stay off
